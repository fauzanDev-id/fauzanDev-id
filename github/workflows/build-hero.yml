name: Build Hero

on:
  push:
    paths:
      - assets/avatar-3d.png
      - assets/hero.template.svg
      - embed-avatar.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp
      - run: node embed-avatar.js assets/avatar-3d.png
      - name: Commit hero.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.svg
          git commit -m "chore: embed avatar into hero" || exit 0
          git push
